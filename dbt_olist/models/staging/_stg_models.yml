version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: olist_orders_dataset
      - name: olist_order_items_dataset
      - name: olist_customers_dataset
      - name: olist_sellers_dataset
      - name: olist_products_dataset
      - name: product_category_name_translation
      - name: olist_order_payments_dataset
      - name: olist_order_reviews_dataset
      - name: olist_geolocation_dataset

models:
  - name: stg_orders
    description: "Cleaned orders dataset"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'invoiced', 'processing', 'approved', 'unavailable', 'canceled', 'created']

  - name: stg_order_items
    description: "Cleaned order items dataset"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_sequence_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id

  - name: stg_customers
    description: "Cleaned customers dataset"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_sellers
    description: "Cleaned sellers dataset"
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: stg_products
    description: "Cleaned products dataset with English translations"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_payments
    description: "Cleaned order payments dataset"
    columns:
      - name: order_id
        tests:
          - not_null

  - name: stg_reviews
    description: "Cleaned order reviews dataset"
    columns:
      - name: review_id
        tests:
          - not_null
